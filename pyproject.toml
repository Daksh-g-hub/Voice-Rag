[project]
name = "voice-rag"
version = "0.1.0"
description = "Voice-Enabled RAG System"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "qdrant-client>=1.8.0",
    "fastembed>=0.2.7",
    "flashrank>=0.2.4",
    "datasets>=2.18.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "tabulate>=0.9.0",
    "pytest>=8.0.0",
    "aiohttp>=3.9.0"
]

[tool.vercel]
entrypoint = "backend.app.main:app"
